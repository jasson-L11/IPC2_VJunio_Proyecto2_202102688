<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>

<body class="bg-gradient-to-b from-black via-sky-950 to-gray-850">
    <div class="flex justify-center mt-10">
        <h1 class="text-4xl font-mono font-bold text-cyan-50">Student Score Module</h1>
        <button class="bg-gray-700 hover:bg-blue-400 text-white font-bold px-10 rounded-2xl ml-10">
            <a href="dashboard.html">Regresar</a>
        </button>
    </div>
    <div class="flex flex-row my-6 justify-center">

        <form class="w-2/5 mx-14 ">
            <label for="underline_select" class="sr-only">Underline select</label>
            <select id="underline_select"
                class="block py-2.5 px-0 w-full text-sm text-gray-500 bg-transparent border-0 border-b-2 border-gray-200 appearance-none dark:text-gray-400 dark:border-gray-700 focus:outline-none focus:ring-0 focus:border-gray-200 peer">
                <option selected>Choose course</option>
                <option value="US">Course 1</option>
                <option value="CA">Course 2</option>
                <option value="FR">Course 3</option>
                <option value="DE">Course 4</option>
            </select>
        </form>

        <button class="bg-gray-700 hover:bg-blue-400 text-white font-bold px-10 rounded-2xl ml-10">
            <a href="dashboard.html">Consultar</a>
        </button>

    </div>
    <div class="mt-10 min-h-screen ">
        <!-- Creamos una tabla con los encabezados ID, USUARIO, CONTRASEÑA-->
        <table class="w-3/4 divide-y divide-gray-400 m-auto">
            <thead class="bg-black">
                <tr>
                    <th class="px-6 py-3 text-center text-xs font-medium text-white uppercase tracking-wider">Actividad
                    </th>
                    <th class="px-6 py-3 text-center text-xs font-medium text-white uppercase tracking-wider">Nota</th>
                </tr>
            </thead>
            <tbody class="bg-transparent divide-y divide-gray-200">
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-white text-center">Id del usuario</td>
                    <td class="px-6 py-4 whitespace-nowrap text-white text-center">Nombre del usuario</td>
                </tr>
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-white text-center">Id del usuario</td>
                    <td class="px-6 py-4 whitespace-nowrap text-white text-center">Nombre del usuario</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>

</html>
