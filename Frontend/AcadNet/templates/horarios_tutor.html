<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios Tutor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="text-xl font-bold text-blue-700">
                AcadNet
            </div>

            <div class="flex space-x-4">
                <a href="{% url 'logout' %}" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 transition">
                    Log Out
                </a>
                <a href="{% url 'dashboard_tutor' username=username %}" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition mr-2">
                    Volver al Dashboard
                </a>
            </div>
        </div>
    </nav>
    <!-- Contenido principal aquí -->
    <div class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded shadow">
        <div class="flex flex-row space-x-4 mb-8">
            <form action="{% url 'uploadSchedule' username=username %}" method="POST" enctype="multipart/form-data" class="flex items-center space-x-4">
                {% csrf_token %}
                <input type="file" name="file" accept=".xml" class="block w-full text-sm text-blue-700 border border-blue-300 rounded cursor-pointer bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="px-6 py-2 bg-blue-700 text-white rounded hover:bg-blue-800 transition font-semibold">
                    Subir Horario
                </button>
            </form>
            <form action="{% url 'uploadSchedule' username=username %}" method="GET" class="flex items-center">
                {% csrf_token %}
                <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition font-semibold">
                    Consultar Horario
                </button>
            </form>
        </div>
        
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-200 rounded">
                <thead>
                    <tr>
                        <th class="px-6 py-3 bg-blue-700 text-white text-left font-semibold">Curso</th>
                        <th class="px-6 py-3 bg-blue-700 text-white text-left font-semibold">Lunes</th>
                        <th class="px-6 py-3 bg-blue-700 text-white text-left font-semibold">Martes</th>
                        <th class="px-6 py-3 bg-blue-700 text-white text-left font-semibold">Miércoles</th>
                        <th class="px-6 py-3 bg-blue-700 text-white text-left font-semibold">Jueves</th>
                        <th class="px-6 py-3 bg-blue-700 text-white text-left font-semibold">Viernes</th>
                    </tr>
                </thead>
                <tbody>
                    {% if data %}
                        {% for key,value in data.items %}
                            <tr>
                                <td class="px-6 py-4 border-t border-gray-200">{{ key }}</td>
                                <td class="px-6 py-4 border-t border-gray-200">{{ value }}</td>
                                <td class="px-6 py-4 border-t border-gray-200">{{ value }}</td>
                                <td class="px-6 py-4 border-t border-gray-200">{{ value }}</td>
                                <td class="px-6 py-4 border-t border-gray-200">{{ value }}</td>
                                <td class="px-6 py-4 border-t border-gray-200">{{ value }}</td>
                            </tr>
                        {% endfor %}
                    {% endif %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
