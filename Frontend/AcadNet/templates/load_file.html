<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Load File</title>
</head>
<body >
    <div class="flex space-x-4 bg-black pt-4 text-white">
        <h1 class="font-mono m-auto text-4xl font-extrabold">Module File</h1>
    </div>
    <nav class="flex flex-row space-x-4 bg-black pt-4 text-white justify-center">
        <ul class="flex space-x-10 bg-black p-2 text-white justify-evenly">
            <li>
                <div>
                    <form method="POST" action="{% url 'previewXML' %}" enctype="multipart/form-data" class="flex items-center gap-10">
                        {% csrf_token %}
                        <input type="file" name="file" accept=".xml" class="text-transparent rounded-lg max-w-40 file:py-2 hover:file:bg-cyan-200" required>
                        <button type="submit" class="bg-gray-700 font-mono text-2xl hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full">
                            Cargar Archivo
                        </button>
                    </form>
                </div>
            </li>
            <li class="rounded-full bg-gray-700 hover:bg-red-400 p-2">
                <a href="{% url 'dashboard' %}"> <span class="font-mono font-semibold text-2xl">Dashboard</span></a>
            </li>
        </ul>

        <form action="{% url 'cleanSystem' %}" class="flex space-x-10 p-2 text-white justify-center ">
            {% csrf_token %}
            <button type="submit" class="bg-gray-700 font-mono text-2xl hover:bg-blue-400 text-white font-bold py-2 px-4 rounded-full"> <span class="font-mono font-semibold text-2xl">Limpiar Datos</span></button>
        </form>
    </nav>
<section class="min-h-screen bg-slate-500 flex flex-col items-center gap-4">
    <h2 class="font-mono mt-4 text-4xl ">Archivo de Entrada</h2>
    <form method="POST" action="{% url 'sendFile' %}" class="w-3/4">
        {% csrf_token %}
        <textarea name="xml_content" class="bg-gray-300 w-full h-80 resize-none rounded-lg">{% if xml_content %}{{xml_content}}{% endif %}</textarea>
        <div class="text-center mt-4">
            <button type="submit" class="bg-gray-700 font-mono text-2xl hover:bg-blue-400 text-white font-bold py-2 px-4 rounded-full">
                Procesar Datos
            </button>
        </div>
    </form>
    
    <h2 class="font-mono text-4xl">Archivo de salida</h2>
    <textarea class="bg-gray-300 w-3/4 h-80 resize-none rounded-lg mb-8">{% if response %}{{response}}{% endif %}</textarea>
</section>
</body>
</html>
