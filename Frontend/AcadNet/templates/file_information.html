<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-black via-sky-950 to-gray-850">
    <div class="flex justify-center mt-10">
        <h1 class="text-4xl font-mono font-bold text-cyan-50">File information Module</h1>
        <button class="bg-gray-700 hover:bg-blue-400 text-white font-bold px-10  rounded-2xl ml-10">
            <a href="{% url 'dashboard' %}">Regresar</a>
        </button>
    </div>
    <div class="flex flex-col justify-center items-center mt-10">
        <!-- Creamos una tabla con los encabezados ID, USUARIO, CONTRASEÑA-->
        <table class="w-3/4 divide-y divide-gray-400 mt-10 ">
            <thead class="bg-black ">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-mono font-bold text-white uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-mono font-bold  text-white uppercase tracking-wider">Usuario</th>
                    <th class="px-6 py-3 text-left text-xs font-mono font-bold text-white uppercase tracking-wider">Contraseña</th>
                </tr>
            </thead>
            <tbody class="bg-transparent divide-y divide-gray-200">
                {% for id, info in data.items %}
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-white">{{ id }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-white">{{ info.nombre }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-white">{{ info.password }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
